name: LISA dependency and source checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q -x '(^|/)(build|dist|assets|installer)/' .
      - name: Install vulnerability scanner
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit pinned dependencies against known advisories
        run: python -m pip_audit -r requirements.txt
